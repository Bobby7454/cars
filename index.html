<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Used Cars for Sale</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/">AutoYard</a>
      <nav><a href="/admin.html">Dealer login</a></nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Find your next car.</h1>
      <p>Inspected used cars with clear pricing. Pick one, send an inquiry, and we will call you back.</p>

      <form class="filters" id="filters" onsubmit="return false">
        <label>Search<input type="search" id="q" placeholder="Make or model"></label>
        <label>Make<select id="make"><option value="">All makes</option></select></label>
        <label>Fuel
          <select id="fuel">
            <option value="">Any</option>
            <option>Petrol</option><option>Diesel</option><option>CNG</option><option>Electric</option><option>Hybrid</option>
          </select>
        </label>
        <label>Max price (₹)<input type="number" id="maxPrice" min="0" step="50000" placeholder="No limit"></label>
        <label>Sort
          <select id="sort">
            <option value="new">Newest first</option>
            <option value="low">Price: low to high</option>
            <option value="high">Price: high to low</option>
            <option value="km">Lowest mileage</option>
          </select>
        </label>
      </form>
    </section>

    <p class="count" id="count" aria-live="polite"></p>
    <section class="grid" id="grid"></section>
  </main>

  <footer><div class="wrap">AutoYard. Prices are negotiable on inspection.</div></footer>

  <script src="/common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let cars = [];

    function fillMakes() {
      const makes = [...new Set(cars.map((c) => c.make))].sort();
      $('make').innerHTML = '<option value="">All makes</option>' + makes.map((m) => `<option>${esc(m)}</option>`).join('');
    }

    function render() {
      const q = $('q').value.trim().toLowerCase();
      const make = $('make').value, fuel = $('fuel').value;
      const max = Number($('maxPrice').value) || Infinity;
      let list = cars.filter((c) =>
        (!q || (c.make + ' ' + c.model).toLowerCase().includes(q)) &&
        (!make || c.make === make) && (!fuel || c.fuel === fuel) && c.price <= max);

      const sort = $('sort').value;
      if (sort === 'low') list.sort((a, b) => a.price - b.price);
      else if (sort === 'high') list.sort((a, b) => b.price - a.price);
      else if (sort === 'km') list.sort((a, b) => a.km - b.km);
      else list.sort((a, b) => b.year - a.year);

      $('count').textContent = list.length + (list.length === 1 ? ' car' : ' cars');
      $('grid').innerHTML = list.length ? list.map((c) => `
        <a class="card ${c.sold ? 'sold' : ''}" href="/car.html?id=${encodeURIComponent(c.id)}">
          <div class="thumb">${carImage(c)}${c.sold ? '<span class="badge">Sold</span>' : ''}</div>
          <div class="body">
            <h3>${esc(c.year)} ${esc(c.make)} ${esc(c.model)}</h3>
            <div class="meta">${km(c.km)}, ${esc(c.fuel)}, ${esc(c.transmission)}</div>
            <div class="price">${inr(c.price)}</div>
          </div>
        </a>`).join('') : '<div class="empty">No cars match these filters. Clear a filter to see more.</div>';
    }

    document.getElementById('filters').addEventListener('input', render);

    fetch('/api/cars').then((r) => r.json()).then((data) => { cars = data; fillMakes(); render(); })
      .catch(() => { $('grid').innerHTML = '<div class="empty">Could not load cars. Refresh the page.</div>'; });
  </script>
</body>
</html>
